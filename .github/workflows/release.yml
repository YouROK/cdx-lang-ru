name: Release

on:
  push:
    tags:
      - "**"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validate plugin
        run: |
          node --check main.js
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            for (const key of ["id", "name", "version", "description", "entry"]) {
              if (!manifest[key]) throw new Error("manifest is missing " + key);
            }
            if (manifest.id !== "lang-ru") throw new Error("unexpected plugin id: " + manifest.id);
            if (!fs.existsSync(manifest.entry)) throw new Error("entry is missing: " + manifest.entry);
            if (process.env.GITHUB_REF_NAME !== manifest.version) {
              throw new Error("tag " + process.env.GITHUB_REF_NAME + " does not match version " + manifest.version);
            }
            const table = JSON.parse(fs.readFileSync("i18n/ru.json", "utf8"));
            const keys = Object.keys(table);
            if (keys.length === 0) throw new Error("the translation table is empty");
            for (const key of keys) {
              if (typeof table[key] !== "string" || !table[key]) throw new Error("empty translation: " + key);
            }
            console.log("lang-ru v" + manifest.version + ", keys: " + keys.length);
          '

      - name: Package
        run: |
          mkdir -p dist
          zip -r "dist/lang-ru-${GITHUB_REF_NAME}.zip" manifest.json main.js i18n README.md LICENSE

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi
